format = """
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$line_break\
$character"""

[directory]
truncation_length = 4
truncate_to_repo = true
style = "bold blue"

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "bold red"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[python]
symbol = " "
format = '[$symbol$version]($style) '
style = "bold yellow"
detect_files = ["requirements.txt", "pyproject.toml", "setup.py", ".python-version"]

[nodejs]
symbol = " "
format = '[$symbol$version]($style) '
style = "bold green"
detect_files = ["package.json", ".node-version", ".nvmrc"]

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[cmd_duration]
min_time = 2_000
format = "took [$duration](bold yellow) "

[line_break]
disabled = false
